name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build (for example v0.4.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'irensaltali/sekvona' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
      - run: yarn install --immutable
      - run: yarn brand:check
      - name: Verify release tag and fork update destination
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: node scripts/verify-release.mjs
      - run: yarn typecheck
      - run: yarn test
      - run: yarn test:fork

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.platform == 'mac' && vars.SEKVONA_DEVELOPER_ID_SHA1 != '' && fromJSON('["self-hosted","macOS","ARM64","sekvona-macos-release"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
      - run: yarn install --immutable
      - run: yarn brand:check
      - name: Build Developer ID signed macOS installers and update feed
        if: matrix.platform == 'mac' && vars.SEKVONA_DEVELOPER_ID_SHA1 != ''
        env:
          SEKVONA_MAC_RELEASE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_NAME: ${{ vars.SEKVONA_DEVELOPER_ID_SHA1 }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          yarn config set supportedArchitectures.cpu --json "[\"current\",\"$RELEASE_ARCH\"]"
          bash scripts/build-mac-distributable.sh "$RELEASE_ARCH"
      - name: Prepare embedded Kopia
        if: matrix.platform == 'mac' && vars.SEKVONA_DEVELOPER_ID_SHA1 == ''
        run: yarn workspace @multizen/desktop prepare:kopia --arch=${{ matrix.arch }}
      - name: Compile desktop
        if: matrix.platform != 'mac' || vars.SEKVONA_DEVELOPER_ID_SHA1 == ''
        run: yarn workspace @multizen/desktop exec electron-vite build
      - run: node apps/desktop/scripts/strip-workspace-symlinks.cjs
        if: matrix.platform != 'mac' || vars.SEKVONA_DEVELOPER_ID_SHA1 == ''
      - name: Package without publishing
        if: matrix.platform != 'mac' || vars.SEKVONA_DEVELOPER_ID_SHA1 == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: yarn workspace @multizen/desktop exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac' && vars.SEKVONA_DEVELOPER_ID_SHA1 != ''
        with:
          name: release-mac-${{ matrix.arch }}
          path: |
            dist/macos-${{ matrix.arch }}/*.dmg
            dist/macos-${{ matrix.arch }}/*.zip
            dist/macos-${{ matrix.arch }}/*.blockmap
            dist/macos-${{ matrix.arch }}/latest-mac.yml
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: matrix.platform != 'mac' || vars.SEKVONA_DEVELOPER_ID_SHA1 == ''
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate
      - run: yarn install --immutable
      - run: yarn brand:check
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
      - name: Validate artifacts and merge architecture feeds
        run: |
          VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          node scripts/collect-release.mjs release-input release-assets "$VERSION"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          MAC_SIGNING_IDENTITY: ${{ vars.SEKVONA_DEVELOPER_ID_SHA1 }}
        run: |
          bash scripts/release-notes.sh "$RELEASE_TAG" > release-notes.md
          cat >> release-notes.md <<'NOTES'

          This fork includes Cloud Sync, MCP gateway/OAuth, and credential backups.
          NOTES
          if [ -n "$MAC_SIGNING_IDENTITY" ]; then
            echo 'macOS: install the Developer ID signed DMG for your architecture once. Later GitHub updates install in-app.' >> release-notes.md
          else
            echo 'macOS: this ad-hoc build checks for updates and links to the matching DMG.' >> release-notes.md
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Sekvona ${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --draft=false --latest
